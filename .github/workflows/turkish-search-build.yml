name: Build ChickenSell Turkish Search

on:
  push:
    paths:
      - '.github/workflows/turkish-search-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Patch Turkish search and display names
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/net/chickensell/ChickenSell.java')
          s=p.read_text(encoding='utf-8')
          old_search='q.isEmpty()||pretty(m).toLowerCase(Locale.ROOT).contains(q)||m.name().toLowerCase(Locale.ROOT).contains(q)'
          new_search='q.isEmpty()||TurkishNames.material(m).toLowerCase(Locale.forLanguageTag("tr-TR")).contains(q.toLowerCase(Locale.forLanguageTag("tr-TR")))||m.name().toLowerCase(Locale.ROOT).contains(q.toLowerCase(Locale.ROOT))'
          if old_search not in s:
              raise SystemExit('Search expression not found')
          s=s.replace(old_search,new_search,1)
          old_names='private String pretty(Material m){return prettyKey(m.name());}private String prettyEnchant(Enchantment e){return prettyKey(e.getKey().getKey());}'
          new_names='private String pretty(Material m){return TurkishNames.material(m);}private String prettyEnchant(Enchantment e){return TurkishNames.enchant(e);}'
          if old_names not in s:
              raise SystemExit('Turkish-name patch target not found')
          s=s.replace(old_names,new_names,1)
          p.write_text(s,encoding='utf-8')
      - name: Build
        run: gradle clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChickenSell-1.4.0-turkish-search-fixed
          path: build/libs/ChickenSell-1.4.0.jar
