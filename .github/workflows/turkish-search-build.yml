name: Build ChickenSell Turkish Search

on:
  push:
    paths:
      - '.github/workflows/turkish-search-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch Turkish search
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/net/chickensell/ChickenSell.java')
          s=p.read_text(encoding='utf-8')
          old='q.isEmpty()||pretty(m).toLowerCase(Locale.ROOT).contains(q)||m.name().toLowerCase(Locale.ROOT).contains(q)'
          new='q.isEmpty()||pretty(m).toLowerCase(Locale.forLanguageTag("tr-TR")).contains(q)||m.name().toLowerCase(Locale.ROOT).contains(q)'
          if old not in s:
              raise SystemExit('Search expression not found')
          s=s.replace(old,new,1)
          oldq='String q=searches.getOrDefault(p.getUniqueId(),"").trim().toLowerCase(Locale.ROOT);'
          newq='String q=searches.getOrDefault(p.getUniqueId(),"").trim().toLowerCase(Locale.forLanguageTag("tr-TR"));'
          if oldq not in s:
              raise SystemExit('Search query normalization not found')
          s=s.replace(oldq,newq,1)
          # build.yml patches pretty(Material) to TurkishNames.material(m) before Maven runs,
          # so filtering pretty(m) now searches the exact Turkish name displayed in the GUI.
          p.write_text(s,encoding='utf-8')
      - name: Apply Turkish display names
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/net/chickensell/ChickenSell.java')
          s=p.read_text(encoding='utf-8')
          old='private String pretty(Material m){return prettyKey(m.name());}private String prettyEnchant(Enchantment e){return prettyKey(e.getKey().getKey());}'
          new='private String pretty(Material m){return TurkishNames.material(m);}private String prettyEnchant(Enchantment e){return TurkishNames.enchant(e);}'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Build
        run: mvn -B package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ChickenSell-1.8.1-turkish-search-fixed
          path: target/*.jar
