name: Build ChickenSell
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Apply MorphWorth base prices
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/net/chickensell/ChickenSell.java')
          s=p.read_text(encoding='utf-8')
          old='private void add(Material m,double p,Category c){prices.put(m,p);categories.put(m,c);}'
          new='private void add(Material m,double p,Category c){prices.put(m,MorphWorthPrices.get(m.name(),p));categories.put(m,c);}'
          if old not in s:
              raise SystemExit('Price hook target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Build
        run: gradle clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChickenSell-1.4.0
          path: build/libs/ChickenSell-1.4.0.jar
