name: ChickenSell
version: 1.1.0
main: net.chickensell.ChickenSell
api-version: '26.2'
author: thevaunbrav
description: Custom sell system for the server.
depend: [Vault]
commands:
  sell:
    description: Opens the sell menu.
    usage: /sell
    permission: chickensell.use
permissions:
  chickensell.use:
    description: Allows use of /sell.
    default: true
